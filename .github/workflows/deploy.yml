name: Build and push image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC - no stored AWS secret
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one image failing shouldn't cancel the unrelated others
      matrix:
        include:
          - repository: echoledger
            dockerfile: Dockerfile
          - repository: echoledger-verification-agent
            dockerfile: services/verification_agent/Dockerfile
          - repository: echoledger-approval-handler
            dockerfile: services/approval_handler/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::529470780389:role/echoledger-github-actions
          aws-region: ap-southeast-2

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ matrix.repository }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f "$DOCKERFILE" -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
