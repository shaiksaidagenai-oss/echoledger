name: Eval Gate

# Runs the real-API golden-set eval - NOT on every push (that's ci.yml,
# which stays free and fast). Weekly schedule + manual trigger only, so
# this costs a few cents a week, not a few cents per commit.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  real-api-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run real-API eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest -m real_api -v
